<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- GOOGLE SEARCH CONSOLE: Paste your meta tag below -->
    <meta name="google-site-verification" content="PASTE_YOUR_CODE_HERE" />
    
    <title>Ali Abdollahzadeh | Mobile Engineer</title>
    <meta name="description" content="ICT for Smart Societies Master's Student at PoliTo. Specialized in Flutter, React Native, and IoT.">

    <style>
        :root {
            --bg-dark: #030712;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-stroke: rgba(255, 255, 255, 0.15);
            --accent: #6366f1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "SF Pro Display", -apple-system, sans-serif; }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* 2026 Animated Mesh Gradient */
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, #4338ca 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #db2777 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #1e1b4b 0%, transparent 100%);
            filter: blur(80px);
            animation: meshMove 20s infinite alternate ease-in-out;
        }

        @keyframes meshMove {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(5%, 5%); }
        }

        /* The Main Glass Container */
        .glass-shell {
            position: relative;
            width: 90%;
            max-width: 440px;
            padding: 40px;
            border-radius: 40px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            
            /* Specular Highlights (The "Thin Edge" look) */
            border: 1px solid var(--glass-stroke);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255,255,255,0.1);
            
            text-align: center;
        }

        /* Profile Image / Icon Area */
        .profile-orbit {
            width: 80px; height: 80px;
            margin: 0 auto 24px;
            border-radius: 22px;
            background: linear-gradient(45deg, #6366f1, #a855f7);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
        }

        h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
        .location { font-size: 14px; opacity: 0.5; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 1px; }

        .bio-box {
            background: rgba(0,0,0,0.2);
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 24px;
            font-size: 15px;
            line-height: 1.5;
            color: rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Project Grid */
        .links-grid { display: grid; gap: 12px; }

        .link-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .link-card:hover {
            background: rgba(255,255,255,0.08);
            transform: scale(1.02);
            border-color: rgba(255,255,255,0.3);
        }

        .status-dot {
            width: 8px; height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        /* Footer / Social Icon */
        .footer-social {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .footer-social a { color: white; opacity: 0.4; transition: 0.3s; }
        .footer-social a:hover { opacity: 1; }

    </style>
</head>
<body>

    <div class="mesh-bg"></div>

    <div class="glass-shell">
        <div class="profile-orbit">👨‍💻</div>
        <h1>Ali Abdollahzadeh</h1>
        <div class="location">Turin, Italy • ICT4SS</div>

        <div class="bio-box">
            Master's Student at <b>PoliTo</b>. Building <b>PoP-app</b> (Oncology Thesis) and <b>Teledrive</b> with Flutter & React Native.
        </div>

        <div class="links-grid">
            <a href="https://github.com/ali-abdollahzadeh" class="link-card">
                <span>📱 Thesis: PoP-app</span>
                <div class="status-dot"></div>
            </a>
            <a href="https://github.com/ali-abdollahzadeh" class="link-card">
                <span>🚗 Teledrive Project</span>
                <div class="status-dot"></div>
            </a>
            <a href="https://linkedin.com" class="link-card" style="opacity: 0.7;">
                <span>💼 Professional LinkedIn</span>
                <span>→</span>
            </a>
        </div>

        <div class="footer-social">
            <!-- Add your icons here -->
            <small>aliabdollahzadeh.dev</small>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Abdollahzadeh | Software Engineer</title>
    <meta name="description" content="Master's Student at Politecnico di Torino specializing in Flutter, React Native, and IoT. Developer of PoP-app and Teledrive.">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.25);
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* 2026 Mesh Gradient Look */
            background: radial-gradient(at 0% 0%, #4f46e5 0px, transparent 50%),
                        radial-gradient(at 100% 0%, #7c3aed 0px, transparent 50%),
                        radial-gradient(at 100% 100%, #db2777 0px, transparent 50%),
                        radial-gradient(at 0% 100%, #2563eb 0px, transparent 50%);
            background-color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-color);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 24px;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.85rem;
            border: 1px solid var(--glass-border);
        }

        .projects {
            text-align: left;
            margin-bottom: 30px;
        }

        .project-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid transparent;
            transition: 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: white;
            display: block;
        }

        .project-item:hover {
            border-color: var(--glass-border);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn {
            display: inline-block;
            background: white;
            color: #0f172a;
            padding: 12px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>Ali Abdollahzadeh</h1>
        <p class="subtitle">ICT for Smart Societies @ PoliTo</p>
        
        <div class="tag-container">
            <span class="tag">Flutter</span>
            <span class="tag">React Native</span>
            <span class="tag">IoT</span>
            <span class="tag">Firebase</span>
        </div>

        <div class="projects">
            <a href="https://github.com/ali-abdollahzadeh" class="project-item">
                <strong>📦 PoP-app</strong>
                <p style="font-size: 0.8rem; opacity: 0.7;">Oncology Prehabilitation Thesis Project</p>
            </a>
            <a href="https://github.com/ali-abdollahzadeh" class="project-item">
                <strong>🚗 Teledrive</strong>
                <p style="font-size: 0.8rem; opacity: 0.7;">Smart Mobility Solutions</p>
            </a>
        </div>

        <a href="https://github.com/ali-abdollahzadeh" class="btn">View GitHub Profile</a>
    </div>

</body>
</html>
